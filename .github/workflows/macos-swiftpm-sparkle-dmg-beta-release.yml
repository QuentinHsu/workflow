name: Reusable SwiftPM Sparkle Beta DMG Release

on:
  workflow_call:
    inputs:
      beta_branch:
        required: false
        type: string
        default: beta
      beta_tag:
        required: false
        type: string
        default: pre-release
      app_target_name:
        required: true
        type: string
      app_display_name:
        required: true
        type: string
      app_bundle_id:
        required: true
        type: string
      app_min_macos:
        required: true
        type: string
      app_icon_path:
        required: false
        type: string
        default: ""
      build_script:
        required: false
        type: string
        default: Scripts/build.sh
      release_notes_script:
        required: false
        type: string
        default: Scripts/generate_release_notes.sh
      release_kit_repository:
        required: false
        type: string
        default: QuentinHsu/macos-app-workflows
      release_kit_ref:
        required: false
        type: string
        default: main
      release_kit_path:
        required: false
        type: string
        default: release-kits/macos/swiftpm-sparkle
      sparkle_public_ed_key:
        required: false
        type: string
        default: ""
      architectures:
        required: false
        type: string
        default: '["arm64","x86_64"]'
    secrets:
      sparkle_private_ed_key:
        required: false

jobs:
  prepare-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: app
          fetch-depth: 0

      - name: Resolve beta release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${{ inputs.beta_branch }}" ]]; then
            echo "This workflow only supports manual runs from ${{ inputs.beta_branch }}. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          source_ref="${GITHUB_SHA}"
          tag="${{ inputs.beta_tag }}"
          version="0.0.0-beta.${GITHUB_RUN_NUMBER}"

          git -C app config user.name "github-actions[bot]"
          git -C app config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C app tag -f "${tag}" "${source_ref}"
          git -C app push --force origin "refs/tags/${tag}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"

  build-dmg:
    needs: prepare-beta
    strategy:
      fail-fast: false
      matrix:
        target_arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}
          path: app

      - name: Checkout release kit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.release_kit_repository }}
          ref: ${{ inputs.release_kit_ref }}
          path: release-kit

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build DMG
        shell: bash
        env:
          APP_TARGET_NAME: ${{ inputs.app_target_name }}
          APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          APP_BUNDLE_ID: ${{ inputs.app_bundle_id }}
          APP_MIN_MACOS: ${{ inputs.app_min_macos }}
          APP_ICON_PATH: ${{ inputs.app_icon_path }}
          APP_PROJECT_DIR: ${{ github.workspace }}/app
          APP_VERSION: ${{ needs.prepare-beta.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare-beta.outputs.build_number }}
          APP_REPOSITORY: ${{ github.repository }}
          DIST_DIR: ${{ github.workspace }}/dist
          SPARKLE_PUBLIC_ED_KEY: ${{ inputs.sparkle_public_ed_key }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "sparkle_public_ed_key is required for app update releases." >&2
            exit 1
          fi
          release-kit/${{ inputs.release_kit_path }}/${{ inputs.build_script }} dmg

      - name: Generate beta Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.sparkle_private_ed_key }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "sparkle_private_ed_key secret is required for app update releases." >&2
            exit 1
          fi

          sign_update_tool="$(find app/.build -path '*/Sparkle*/bin/sign_update' -type f | head -n 1 || true)"
          if [[ -z "$sign_update_tool" || ! -x "$sign_update_tool" ]]; then
            echo "Sparkle sign_update tool not found under .build" >&2
            exit 1
          fi

          dmg_name="${{ inputs.app_target_name }}-${{ needs.prepare-beta.outputs.version }}-${TARGET_ARCH}.dmg"

          release-kit/${{ inputs.release_kit_path }}/Scripts/generate_sparkle_appcast.py \
            --dmg "dist/${dmg_name}" \
            --sign-update-tool "$sign_update_tool" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.prepare-beta.outputs.tag }}/${dmg_name}" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.prepare-beta.outputs.tag }}" \
            --version "${{ needs.prepare-beta.outputs.version }}" \
            --build-version "${{ needs.prepare-beta.outputs.build_number }}" \
            --minimum-system-version "${{ inputs.app_min_macos }}" \
            --title "${{ inputs.app_display_name }} ${{ needs.prepare-beta.outputs.version }}" \
            --channel "beta" \
            --output "dist/appcast-${TARGET_ARCH}.xml"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: dmg-${{ matrix.target_arch }}
          path: |
            dist/${{ inputs.app_target_name }}-${{ needs.prepare-beta.outputs.version }}-${{ matrix.target_arch }}.dmg
            dist/${{ inputs.app_target_name }}-${{ needs.prepare-beta.outputs.version }}-${{ matrix.target_arch }}.dmg.sha256
            dist/appcast-${{ matrix.target_arch }}.xml
          if-no-files-found: error

  release:
    needs: [prepare-beta, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}
          fetch-depth: 0
          path: app

      - name: Checkout release kit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.release_kit_repository }}
          ref: ${{ inputs.release_kit_ref }}
          path: release-kit

      - name: Download DMG artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Generate release body
        shell: bash
        run: |
          cd app
          ../release-kit/${{ inputs.release_kit_path }}/${{ inputs.release_notes_script }} "${{ needs.prepare-beta.outputs.tag }}" "${{ needs.prepare-beta.outputs.version }}" ../release.md

      - name: Publish beta release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-beta.outputs.tag }}
          RELEASE_TARGET: ${{ needs.prepare-beta.outputs.source_ref }}
          RELEASE_NAME: ${{ inputs.app_display_name }} ${{ needs.prepare-beta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.dmg dist/*.sha256 dist/appcast-*.xml)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_NAME" \
              --notes-file release.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_NAME" \
              --notes-file release.md \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
