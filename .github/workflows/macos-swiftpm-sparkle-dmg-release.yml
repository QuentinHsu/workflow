name: Reusable SwiftPM Sparkle DMG Release

on:
  workflow_call:
    inputs:
      app_target_name:
        required: true
        type: string
      app_display_name:
        required: true
        type: string
      app_bundle_id:
        required: true
        type: string
      app_min_macos:
        required: true
        type: string
      app_icon_path:
        required: false
        type: string
        default: ""
      macos_runner:
        required: false
        type: string
        default: macos-15
      xcode_version:
        required: false
        type: string
        default: latest-stable
      build_script:
        required: false
        type: string
        default: Scripts/build.sh
      release_notes_script:
        required: false
        type: string
        default: Scripts/generate_release_notes.sh
      changelog_script:
        required: false
        type: string
        default: Scripts/update_changelog.py
      changelog_path:
        required: false
        type: string
        default: CHANGELOG.md
      changelog_enabled:
        required: false
        type: boolean
        default: true
      changelog_language:
        required: false
        type: string
        default: zh-CN
      changelog_summary_command:
        required: false
        type: string
        default: ""
      changelog_summary_setup_command:
        required: false
        type: string
        default: ""
      release_kit_repository:
        required: false
        type: string
        default: QuentinHsu/macos-app-workflows
      release_kit_ref:
        required: false
        type: string
        default: main
      release_kit_path:
        required: false
        type: string
        default: release-kits/macos/swiftpm-sparkle
      sparkle_public_ed_key:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""
      bump:
        required: false
        type: string
        default: auto
      architectures:
        required: false
        type: string
        default: '["arm64","x86_64"]'
      code_sign_identity:
        required: false
        type: string
        default: ""
    secrets:
      sparkle_private_ed_key:
        required: false
      changelog_summary_token:
        required: false
      code_sign_certificate_base64:
        required: false
      code_sign_certificate_password:
        required: false
      notarization_key_base64:
        required: false
      notarization_key_id:
        required: false
      notarization_issuer_id:
        required: false

jobs:
  prepare-version:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      remote_tag_exists: ${{ steps.version.outputs.remote_tag_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: app
          fetch-depth: 0

      - name: Checkout release kit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.release_kit_repository }}
          ref: ${{ inputs.release_kit_ref }}
          path: release-kit

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          extract_version() {
            local raw="$1"
            if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }

          previous_tag=""

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="$(extract_version "$tag")"
            previous_tag="$(git -C app tag -l 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "$tag" | head -n 1 || true)"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
            version="$(extract_version "$tag")"
            previous_tag="$(git -C app tag -l 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "$tag" | head -n 1 || true)"
          else
            previous_tag="$(git -C app tag -l 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            base_version="0.0.0"
            range="HEAD"
            if [[ -n "$previous_tag" ]]; then
              base_version="${previous_tag#v}"
              range="${previous_tag}..HEAD"
            fi

            bump="${INPUT_BUMP:-auto}"
            if [[ "$bump" == "auto" || -z "$bump" ]]; then
              commit_lines="$(git -C app log --format='%s%n%b' $range)"
              bump=""
              if grep -Eq 'BREAKING CHANGE|^[^[:space:]]+(\([^)]+\))?!:' <<< "$commit_lines"; then
                bump="major"
              elif grep -Eq '^feat(\([^)]+\))?:' <<< "$commit_lines"; then
                bump="minor"
              elif grep -Eq '^(fix|perf|refactor|build|ci|revert|chore|docs|style|test)(\([^)]+\))?:' <<< "$commit_lines"; then
                bump="patch"
              fi
            fi

            if [[ "$bump" != "major" && "$bump" != "minor" && "$bump" != "patch" ]]; then
              echo "Unsupported or unresolved bump type: ${bump:-empty}" >&2
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$base_version"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            tag="v${major}.${minor}.${patch}"
            version="${major}.${minor}.${patch}"
          fi

          if [[ -z "${version:-}" ]]; then
            echo "Could not resolve version from tag: ${tag:-empty}" >&2
            exit 1
          fi

          remote_tag_exists="false"
          if git -C app ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            remote_tag_exists="true"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "remote_tag_exists=${remote_tag_exists}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for optional Copilot summary
        if: github.event_name != 'push' && inputs.changelog_enabled && steps.version.outputs.remote_tag_exists != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up changelog summary command
        if: github.event_name != 'push' && inputs.changelog_enabled && steps.version.outputs.remote_tag_exists != 'true'
        shell: bash
        env:
          CHANGELOG_SUMMARY_SETUP_COMMAND: ${{ inputs.changelog_summary_setup_command }}
          CHANGELOG_SUMMARY_TOKEN: ${{ secrets.changelog_summary_token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.changelog_summary_token }}
          COPILOT_ALLOW_ALL: "true"
          GH_TOKEN: ${{ secrets.changelog_summary_token }}
          GITHUB_TOKEN: ${{ secrets.changelog_summary_token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "false"
        run: |
          set -euo pipefail

          if [[ -n "${CHANGELOG_SUMMARY_SETUP_COMMAND:-}" ]]; then
            eval "$CHANGELOG_SUMMARY_SETUP_COMMAND"
          elif [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            npm install -g @github/copilot
          else
            echo "No changelog summary token or setup command configured; local fallback will be used."
          fi

      - name: Update changelog from commits
        if: github.event_name != 'push' && inputs.changelog_enabled && steps.version.outputs.remote_tag_exists != 'true'
        shell: bash
        env:
          CHANGELOG_SUMMARY_COMMAND_INPUT: ${{ inputs.changelog_summary_command }}
          CHANGELOG_SUMMARY_TOKEN: ${{ secrets.changelog_summary_token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.changelog_summary_token }}
          COPILOT_ALLOW_ALL: "true"
          GH_TOKEN: ${{ secrets.changelog_summary_token }}
          GITHUB_TOKEN: ${{ secrets.changelog_summary_token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "false"
        run: |
          set -euo pipefail

          cd app

          changelog_summary_command="${CHANGELOG_SUMMARY_COMMAND_INPUT:-}"
          if [[ -z "$changelog_summary_command" && -n "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            changelog_summary_command='copilot -s --allow-all-tools --no-ask-user --no-custom-instructions --disable-builtin-mcps -p "$(cat {prompt_file})"'
          fi

          export CHANGELOG_SUMMARY_COMMAND="$changelog_summary_command"

          python3 "../release-kit/${{ inputs.release_kit_path }}/${{ inputs.changelog_script }}" \
            --version "${{ steps.version.outputs.version }}" \
            --from-ref "${{ steps.version.outputs.previous_tag }}" \
            --to-ref HEAD \
            --changelog "${{ inputs.changelog_path }}" \
            --project-name "${{ inputs.app_display_name }}" \
            --language "${{ inputs.changelog_language }}" \
            --mode write

      - name: Commit changelog
        if: github.event_name != 'push' && inputs.changelog_enabled && steps.version.outputs.remote_tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd app
          git add "${{ inputs.changelog_path }}"

          if git diff --cached --quiet -- "${{ inputs.changelog_path }}"; then
            echo "${{ inputs.changelog_path }} unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): release ${{ steps.version.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create and push release tag
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail

          cd app
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists on origin, reusing it."
            exit 0
          fi

          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
          fi

          git push origin "$tag"

  build-dmg:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        target_arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ inputs.macos_runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}
          path: app

      - name: Checkout release kit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.release_kit_repository }}
          ref: ${{ inputs.release_kit_ref }}
          path: release-kit

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Import code signing certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.code_sign_certificate_base64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.code_sign_certificate_password }}
          INPUT_CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity }}
        run: |
          set -euo pipefail

          if [[ -z "${CERTIFICATE_BASE64:-}" ]]; then
            echo "code_sign_certificate_base64 is not set; release will use ad-hoc signing."
            exit 0
          fi

          if [[ -z "${CERTIFICATE_PASSWORD:-}" ]]; then
            echo "code_sign_certificate_password is required when code_sign_certificate_base64 is set." >&2
            exit 1
          fi

          keychain_password="$(uuidgen)"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/code-signing.p12"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

          identity="$INPUT_CODE_SIGN_IDENTITY"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1 || true)"
          fi

          if [[ -z "$identity" ]]; then
            echo "Could not find a Developer ID Application signing identity in the imported certificate." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi

          echo "CODE_SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          echo "Using code signing identity: ${identity}"

      - name: Build DMG
        shell: bash
        env:
          APP_TARGET_NAME: ${{ inputs.app_target_name }}
          APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          APP_BUNDLE_ID: ${{ inputs.app_bundle_id }}
          APP_MIN_MACOS: ${{ inputs.app_min_macos }}
          APP_ICON_PATH: ${{ inputs.app_icon_path }}
          APP_PROJECT_DIR: ${{ github.workspace }}/app
          APP_VERSION: ${{ needs.prepare-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare-version.outputs.build_number }}
          APP_REPOSITORY: ${{ github.repository }}
          DIST_DIR: ${{ github.workspace }}/dist
          SPARKLE_PUBLIC_ED_KEY: ${{ inputs.sparkle_public_ed_key }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "sparkle_public_ed_key is required for app update releases." >&2
            exit 1
          fi
          release-kit/${{ inputs.release_kit_path }}/${{ inputs.build_script }} dmg

      - name: Notarize DMG
        shell: bash
        env:
          NOTARIZATION_KEY_BASE64: ${{ secrets.notarization_key_base64 }}
          NOTARIZATION_KEY_ID: ${{ secrets.notarization_key_id }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.notarization_issuer_id }}
          DMG_NAME: ${{ inputs.app_target_name }}-${{ needs.prepare-version.outputs.version }}-${{ matrix.target_arch }}.dmg
        run: |
          set -euo pipefail

          if [[ -z "${NOTARIZATION_KEY_BASE64:-}" ]]; then
            echo "notarization_key_base64 is not set; skipping notarization."
            exit 0
          fi

          if [[ -z "${CODE_SIGN_IDENTITY:-}" || -z "${NOTARIZATION_KEY_ID:-}" || -z "${NOTARIZATION_ISSUER_ID:-}" ]]; then
            echo "CODE_SIGN_IDENTITY, notarization_key_id, and notarization_issuer_id are required for notarization." >&2
            exit 1
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${NOTARIZATION_KEY_ID}.p8"
          printf '%s' "$NOTARIZATION_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          dmg_path="dist/${DMG_NAME}"
          xcrun notarytool submit "$dmg_path" \
            --key "$key_path" \
            --key-id "$NOTARIZATION_KEY_ID" \
            --issuer "$NOTARIZATION_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          (cd dist && shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256")

      - name: Generate Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.sparkle_private_ed_key }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]]; then
            echo "sparkle_private_ed_key secret is required for app update releases." >&2
            exit 1
          fi

          sign_update_tool="$(find app/.build -path '*/Sparkle*/bin/sign_update' -type f | head -n 1 || true)"
          if [[ -z "$sign_update_tool" || ! -x "$sign_update_tool" ]]; then
            echo "Sparkle sign_update tool not found under .build" >&2
            exit 1
          fi

          dmg_name="${{ inputs.app_target_name }}-${{ needs.prepare-version.outputs.version }}-${TARGET_ARCH}.dmg"

          release-kit/${{ inputs.release_kit_path }}/Scripts/generate_sparkle_appcast.py \
            --dmg "dist/${dmg_name}" \
            --sign-update-tool "$sign_update_tool" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.prepare-version.outputs.tag }}/${dmg_name}" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.prepare-version.outputs.tag }}" \
            --version "${{ needs.prepare-version.outputs.version }}" \
            --build-version "${{ needs.prepare-version.outputs.build_number }}" \
            --minimum-system-version "${{ inputs.app_min_macos }}" \
            --title "${{ inputs.app_display_name }} ${{ needs.prepare-version.outputs.version }}" \
            --output "dist/appcast-${TARGET_ARCH}.xml"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: dmg-${{ matrix.target_arch }}
          path: |
            dist/${{ inputs.app_target_name }}-${{ needs.prepare-version.outputs.version }}-${{ matrix.target_arch }}.dmg
            dist/${{ inputs.app_target_name }}-${{ needs.prepare-version.outputs.version }}-${{ matrix.target_arch }}.dmg.sha256
            dist/appcast-${{ matrix.target_arch }}.xml
          if-no-files-found: error

  release:
    needs: [prepare-version, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}
          fetch-depth: 0
          path: app

      - name: Checkout release kit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.release_kit_repository }}
          ref: ${{ inputs.release_kit_ref }}
          path: release-kit

      - name: Download DMG artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Generate release body
        shell: bash
        env:
          APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          CHANGELOG_LANGUAGE: ${{ inputs.changelog_language }}
        run: |
          cd app
          ../release-kit/${{ inputs.release_kit_path }}/${{ inputs.release_notes_script }} "${{ needs.prepare-version.outputs.tag }}" "${{ needs.prepare-version.outputs.version }}" ../release.md

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag }}
          RELEASE_NAME: ${{ inputs.app_display_name }} ${{ needs.prepare-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.dmg dist/*.sha256 dist/appcast-*.xml)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release.md
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
